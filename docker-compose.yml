# Local Postgres for development. In production this is Supabase — same Postgres,
# same schema, just a different DATABASE_URL. Nothing in the app code changes.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: swip
      POSTGRES_PASSWORD: swip
      POSTGRES_DB: swip
    ports:
      - "5432:5432"
    volumes:
      - swip_pgdata:/var/lib/postgresql/data
volumes:
  swip_pgdata:
